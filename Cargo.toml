[workspace]
members = [
  "crates/choregraph-cli",
  "crates/choregraph-core",
  "crates/choregraph-kamacite",
  "crates/choregraph-nickel",
  "crates/choregraph-release",
  "crates/choregraph-seaglass",
  "tools/choregraph-foundation-check",
]
exclude = [
  "vendor/bounded-exec-selected",
  "vendor/cap-root-core-selected",
  "vendor/execution-graph-core-selected",
]
resolver = "3"

[workspace.metadata.octet]
default_scope = ["--workspace"]
cargo_check_args = ["--all-targets", "--ignore-rust-version"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
blake3 = "=1.8.2"
bounded-exec = { path = "vendor/bounded-exec-selected/crates/bounded-exec", version = "=0.1.0" }
cap-fs-ext = "=4.0.2"
cap-root-core = { path = "vendor/cap-root-core-selected", version = "=0.1.0" }
cap-std = "=4.0.2"
cargo_metadata = "=0.23.1"
choregraph-core = { path = "crates/choregraph-core", version = "=0.1.0" }
choregraph-kamacite = { path = "crates/choregraph-kamacite", version = "=0.1.0" }
choregraph-nickel = { path = "crates/choregraph-nickel", version = "=0.1.0" }
choregraph-release = { path = "crates/choregraph-release", version = "=0.1.0" }
choregraph-seaglass = { path = "crates/choregraph-seaglass", version = "=0.1.0" }
preserves = { version = "=5.0.0-rc.7", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
