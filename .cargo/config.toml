# Trellis verifies the same production functions that Choregraph calls. Its
# published crate uses the still-unstable register_tool feature to preserve
# verifier attributes in normal Cargo builds. Limit the bootstrap exception to
# that exact crate; Choregraph crates remain on the pinned stable toolchain.
[env]
RUSTC_BOOTSTRAP = { value = "verified_logic", force = true }

[net]
git-fetch-with-cli = true
