# Octet severity comes from the generated deny-all DYLINT_RUSTFLAGS policy.
# Do not add disabled_lints or warning-level overrides here.

[octet]

# The proof-linked and canonical-codec files stay co-located for direct review.
# The verified kernel keeps the production transition relation, suspension
# profile tables, and proof-linked specifications in one reviewable file so
# the proof identity tracks exactly one source. Split only with a proof-aware
# migration and manifest re-binding.
excessive_file_length_max = 1900

# The core and Kamacite adapters use bounded, responsibility-specific modules.
# The adapter identity also loads its reviewed Rust sources as canonical material.
# Tighten this limit after a proof-aware module migration.
module_file_count_max = 10
