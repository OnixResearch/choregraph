[package]
name = "choregraph-wasm"
description = "Export-only WebAssembly component adapter for the Choregraph production kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# wit-bindgen emits the reviewed Component Model ABI with unsafe exports.
# Foundation checks reject unsafe tokens in all handwritten adapter source.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3.workspace = true
choregraph-core.workspace = true
choregraph-kamacite.workspace = true
preserves.workspace = true
serde.workspace = true
serde_bytes.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"] }
