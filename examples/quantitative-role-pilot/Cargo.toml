[workspace]

[package]
name = "choregraph-quantitative-role-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
blake3 = "1.8.2"
choregraph-choreography = { path = "../../crates/choregraph-choreography" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
